<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>亡者图鉴 · 建筑文案后台</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0f0d; color: #e8dfcd; font-family: "Microsoft YaHei", monospace; }
  .wrap { max-width: 980px; margin: 30px auto; padding: 0 16px; }
  h1 { color: #e0a94a; font-size: 24px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  input, select, textarea { background: #141a17; color: #ece8dd; border: 1px solid #3b493f; padding: 9px 10px; font: inherit; border-radius: 6px; }
  input, select { min-width: 220px; }
  textarea { width: 100%; height: 220px; line-height: 1.6; }
  button { background: #e0a94a; color: #17120b; border: 0; padding: 10px 18px; font-weight: 900; border-radius: 6px; cursor: pointer; }
  button.ghost { background: #1c261f; color: #e0a94a; border: 1px solid #3b493f; }
  .hint { color: #8a9a8d; font-size: 13px; line-height: 1.6; }
  .status { margin-top: 10px; color: #7fc79a; white-space: pre-wrap; }
  .card { border: 1px solid #29332d; background: #0f1412; border-radius: 10px; padding: 16px; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>建筑文案后台</h1>
  <div class="hint">修改后写入服务器 data/building_content.json；在线网站会通过 /api/buildings/content 读取。离线版需要在导出时重新打包。</div>
  <div class="card">
    <div class="row"><input id="token" placeholder="后台口令"><button id="saveToken" class="ghost">保存口令</button></div>
    <div class="row"><select id="building"></select><button id="reload" class="ghost">刷新</button></div>
    <textarea id="desc" placeholder="建筑描述"></textarea>
    <div class="row"><button id="save">保存建筑描述</button><span class="status" id="status"></span></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let content = {};
let buildings = [];
function token() { return $("token").value.trim(); }
try { $("token").value = localStorage.getItem("wz_admin_token") || ""; } catch (e) {}
$("saveToken").onclick = () => { try { localStorage.setItem("wz_admin_token", token()); } catch (e) {} $("status").textContent = "口令已保存在本机"; };
async function loadAll() {
  $("status").textContent = "加载中…";
  try {
    const [a, b] = await Promise.all([
      fetch("/api/buildings").then(r => r.json()),
      fetch("/api/buildings/content").then(r => r.json())
    ]);
    buildings = (a && a.buildings) || [];
    content = (b && b.content) || {};
    $("building").innerHTML = buildings.map(x => '<option value="' + x.id + '">' + x.region + " / " + x.name + " (" + x.id + ")" + "</option>").join("");
    $("status").textContent = "已加载 " + buildings.length + " 座建筑，" + Object.keys(content).length + " 条后台文案";
    show();
  } catch (e) { $("status").textContent = "加载失败：" + e; }
}
function show() { const id = $("building").value; $("desc").value = content[id] || ""; }
$("building").onchange = show;
$("reload").onclick = loadAll;
$("save").onclick = async () => {
  const id = $("building").value;
  if (!id) return;
  $("status").textContent = "保存中…";
  try {
    const r = await fetch("/api/buildings/content", { method: "POST", headers: { "Content-Type": "application/json", "x-admin-token": token() }, body: JSON.stringify({ id, description: $("desc").value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    content[id] = $("desc").value;
    $("status").textContent = "已保存：" + id;
  } catch (e) { $("status").textContent = "保存失败：" + e.message; }
};
loadAll();
</script>
</body>
</html>
